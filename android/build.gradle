plugins { id 'com.android.application' }

android {
    namespace 'com.pixelpennant.android'
    compileSdk 35

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.pixelpennant.android'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    sourceSets.main.java.srcDirs = ['src/main/java']
    packaging.resources.excludes += ['META-INF/robovm/ios/robovm.xml']
}

configurations { natives }

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugarJdkLibsVersion"
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

tasks.register('copyAndroidNatives') {
    doFirst {
        file('src/main/jniLibs/arm64-v8a').mkdirs(); file('src/main/jniLibs/armeabi-v7a').mkdirs(); file('src/main/jniLibs/x86_64').mkdirs()
        configurations.natives.files.each { jar ->
            def abi = jar.name.contains('arm64-v8a') ? 'arm64-v8a' : jar.name.contains('armeabi-v7a') ? 'armeabi-v7a' : 'x86_64'
            copy { from zipTree(jar); into "src/main/jniLibs/$abi"; include '*.so' }
        }
    }
}
tasks.configureEach { if (name.contains('merge') && name.contains('JniLibFolders')) dependsOn copyAndroidNatives }
